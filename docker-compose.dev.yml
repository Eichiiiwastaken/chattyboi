name: chattyboi-dev

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_USER: chattyboi
      POSTGRES_PASSWORD: chattyboi
      POSTGRES_DB: chattyboi
    volumes:
      - dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chattyboi -d chattyboi"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:63799:6379"
    volumes:
      - dev-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  dev-pgdata:
  dev-redisdata:
